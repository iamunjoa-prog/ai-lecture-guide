<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<!--
  OG 이미지·앱 아이콘 템플릿 (scripts/make-og.ts가 Playwright로 캡처한다).
  폰트는 npm 패키지 pretendard의 woff2를 file://로 직접 읽는다(CDN 없음).
  ?mode=og → 1200x630 · ?mode=apple → 180x180
-->
<style>
  @font-face {
    font-family: "PretendardLocal";
    font-weight: 45 920;
    font-display: block;
    src: url("../node_modules/pretendard/dist/web/variable/woff2/PretendardVariable.woff2") format("woff2-variations");
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0b0b0c; }
  body { font-family: "PretendardLocal", sans-serif; color: #f5f5f7; word-break: keep-all; -webkit-font-smoothing: antialiased; }

  .og { display: none; width: 1200px; height: 630px; padding: 76px 88px; position: relative; overflow: hidden; background: #0b0b0c; }
  .apple { display: none; width: 180px; height: 180px; position: relative; background: #0b0b0c; }
  body[data-mode="og"] .og { display: flex; flex-direction: column; justify-content: center; }
  body[data-mode="apple"] .apple { display: block; }

  .eyebrow { display: flex; align-items: center; gap: 16px; font-size: 28px; font-weight: 600; letter-spacing: -0.01em; color: #a1a1a6; }
  .eyebrow i { display: block; width: 14px; height: 14px; border-radius: 50%; background: #ff6a1a; }
  h1 { margin-top: 36px; font-size: 104px; font-weight: 800; line-height: 1.12; letter-spacing: -0.045em; color: #f5f5f7; }
  h1 em { font-style: normal; color: #ff6a1a; }
  .sub { margin-top: 44px; font-size: 32px; font-weight: 500; line-height: 1.4; letter-spacing: -0.01em; color: #a1a1a6; }
  .rule { position: absolute; left: 88px; right: 88px; bottom: 64px; height: 2px; background: #2c2c2e; }
  .rule::after { content: ""; position: absolute; left: 0; top: 0; width: 120px; height: 2px; background: #ff6a1a; }

  .apple svg { position: absolute; inset: 0; width: 180px; height: 180px; }
</style>
</head>
<body>
  <main class="og">
    <p class="eyebrow"><i></i>AI 강의 길잡이</p>
    <h1>AI를 만든 사람에게<br /><em>직접 배우세요.</em></h1>
    <p class="sub">검증된 유튜브 AI 강의를 수준·목표별로 선별합니다</p>
    <div class="rule"></div>
  </main>

  <div class="apple">
    <!-- src/app/icon.svg와 같은 마크. 애플 아이콘은 모서리를 OS가 깎으므로 꽉 찬 사각형 -->
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <rect width="64" height="64" fill="#0b0b0c" />
      <path d="M15 45h12V33h12V21" fill="none" stroke="#f5f5f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="45" cy="17" r="6.5" fill="#ff6a1a" />
    </svg>
  </div>

  <script>
    document.body.dataset.mode = new URLSearchParams(location.search).get("mode") || "og";
  </script>
</body>
</html>
